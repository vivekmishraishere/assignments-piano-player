<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Piano Keyboard Assignment</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main>
        <h1>Piano Player</h1>
        <div id="pianobox">
            <div id="piano">
                <div id="keyA" class="white">
                    <!-- <div id="keyZ" class="black"> </div>-->
                <h2>A</h2></div>
                <div id="keyS"class="white">
                    <!-- <div id="KeyX" class="black"></div> -->
                    <h2>S</h2></div>
                <div id="keyD"class="white"><h2>D</h2></div>
                <div id="keyF"class="white"><h2>F</h2></div>
                <div id="keyG"class="white"><h2>G</h2></div>
                <div id="keyH"class="white"><h2>H</h2></div>
                <div id="keyJ"class="white"><h2>J</h2></div>
                <div id="keyK"class="white"><h2>K</h2></div>
                <div id="keyL"class="white"><h2>L</h2></div>
                <div id="keySem"class="white"><h2>;</h2></div>
            </div>

        </div>
    </main>
    


<script src="script.js"></script>
</body>
</html>
